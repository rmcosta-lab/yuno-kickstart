# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: volta-api
    runtime: python
    region: virginia
    plan: free
    numInstances: 1
    buildCommand: uv sync --frozen --all-packages --no-dev
    preDeployCommand: uv run --no-sync alembic -c backend/alembic.ini upgrade head
    startCommand: >-
      uv run --no-sync --package yuno-api uvicorn app.main:app
      --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: UV_VERSION
        value: 0.12.7
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: volta-postgres
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: VOLTA_DEMO_BEARER_TOKEN
        sync: false
      - key: VOLTA_EVIDENCE_STORAGE_PATH
        value: /tmp/yuno-volta-text-evidence
      - key: VOLTA_EXTRACTION_MODE
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_EXTRACTION_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2.1
      - key: VOLTA_MUTATION_RATE_LIMIT_REQUESTS
        value: "30"
      - key: VOLTA_MUTATION_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: VOLTA_MUTATION_RATE_LIMIT_MAX_IDENTITIES
        value: "256"

databases:
  - name: volta-postgres
    region: virginia
    plan: free
    diskSizeGB: 1
    postgresMajorVersion: "17"
    databaseName: volta
    user: volta
    ipAllowList: []
