[project]
name = "yuno-api"
version = "0.1.0"
description = "FastAPI HTTP boundary for Yuno × Nauta"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.121.1",
    "pydantic-settings>=2.12.0",
    "structlog>=25.5.0",
    "yuno-backend",
]

[tool.uv.sources]
yuno-backend = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.fastapi]
entrypoint = "app.main:app"
