[project]
name = "yuno-kickstart"
version = "0.1.0"
description = "Yuno × Nauta hackathon monorepo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "yuno-api",
    "yuno-backend",
]

[tool.uv]
package = false

[tool.uv.sources]
yuno-api = { workspace = true }
yuno-backend = { workspace = true }

[tool.uv.workspace]
members = ["api", "backend"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.14.5",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["api/tests", "backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["frontend", "api/openapi.json"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "FAST"]
